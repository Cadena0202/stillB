<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log — Remember the promise.</title>
<link href="fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --mustard: #c8a93a; --text: rgba(220,230,245,0.78); --text-dim: rgba(170,190,215,0.48); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; min-height:100vh; background:#0c1019; color:var(--text); font-family:'Shippori Mincho',serif; overflow-x:hidden; }
  #bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .corner { position:fixed; width:16px; height:16px; border-style:solid; z-index:50; pointer-events:none; opacity:0.28; }
  .corner-tl { top:14px; left:14px;   border-color:rgba(200,220,255,0.55); border-width:1px 0 0 1px; }
  .corner-tr { top:14px; right:14px;  border-color:rgba(200,220,255,0.55); border-width:1px 1px 0 0; }
  .corner-bl { bottom:14px; left:14px;  border-color:rgba(200,220,255,0.55); border-width:0 0 1px 1px; }
  .corner-br { bottom:14px; right:14px; border-color:rgba(200,220,255,0.55); border-width:0 1px 1px 0; }

  /* header */
  header { padding:22px 36px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(200,220,255,0.07); position:relative; z-index:20; }
  .site-title { font-family:'IM Fell English',serif; font-style:italic; font-size:13px; color:rgba(210,225,255,0.40); letter-spacing:0.18em; text-decoration:none; }
  nav { display:flex; gap:28px; align-items:center; }
  nav a { font-family:'Cormorant Garamond',serif; font-size:11px; color:rgba(160,185,220,0.38); text-decoration:none; letter-spacing:0.22em; text-transform:uppercase; transition:color 0.3s; position:relative; }
  nav a::after { content:''; position:absolute; bottom:-3px; left:0; width:0; height:1px; background:var(--mustard); transition:width 0.3s; opacity:0.5; }
  nav a:hover { color:rgba(200,215,255,0.70); }
  nav a:hover::after { width:100%; }
  nav a.active { color:rgba(200,169,58,0.60); }

  /* story link icon */
  .story-link { font-size:15px; opacity:0.45; text-decoration:none; transition:opacity 0.3s; cursor:pointer; }
  .story-link:hover { opacity:0.80; }

  /* ログラップ */
  .log-wrap { max-width:820px; margin:0 auto; padding:32px 28px 100px; width:100%; position:relative; z-index:10; }

  /* カテゴリバー */
  .category-bar { display:flex; align-items:center; gap:0; margin-bottom:28px; }
  .cat-btn { background:rgba(20,28,44,0.80); border:1px solid rgba(200,220,255,0.10); color:rgba(160,185,220,0.42); font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.20em; padding:6px 16px; cursor:pointer; transition:all 0.3s; border-right:none; }
  .cat-btn:last-of-type { border-right:1px solid rgba(200,220,255,0.10); border-radius:0 3px 3px 0; }
  .cat-btn:first-child { border-radius:3px 0 0 3px; }
  .cat-btn.active { background:rgba(200,220,255,0.11); color:rgba(210,228,255,0.78); border-color:rgba(200,220,255,0.20); }
  .cat-btn:hover:not(.active) { background:rgba(200,220,255,0.05); color:rgba(200,215,255,0.62); }
  .cat-line { flex:1; height:1px; background:linear-gradient(to right,rgba(200,220,255,0.12),transparent); margin-left:14px; }

  /* カードグリッド */
  .card-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .log-card { background:rgba(14,20,34,0.65); border:1px solid rgba(200,220,255,0.09); padding:16px 14px 14px; cursor:pointer; position:relative; overflow:hidden; transition:border-color 0.3s,background 0.3s,transform 0.25s; opacity:0; transform:translateY(8px); animation:cardrise 0.55s ease forwards; display:flex; flex-direction:column; gap:9px; min-height:110px; }
  .log-card:hover { border-color:rgba(200,220,255,0.20); background:rgba(18,26,44,0.80); transform:translateY(-2px); }
  @keyframes cardrise { to { opacity:1; transform:translateY(0); } }
  .card-date { font-family:'Cormorant Garamond',serif; font-size:10px; color:rgba(160,185,220,0.38); letter-spacing:0.12em; }
  .card-title { font-family:'IM Fell English',serif; font-size:14px; color:rgba(210,225,255,0.65); letter-spacing:0.06em; line-height:1.4; writing-mode:vertical-rl; max-height:68px; overflow:hidden; position:absolute; right:13px; top:13px; }
  .card-body { font-size:11px; line-height:1.9; color:rgba(180,205,235,0.42); letter-spacing:0.03em; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; padding-right:26px; }
  .card-cat-dot { position:absolute; bottom:0; left:0; width:26px; height:26px; border-radius:0 26px 0 0; }
  .dot-to  { background:rgba(90,180,240,0.35); }
  .dot-me  { background:rgba(160,110,220,0.30); }
  .dot-all { background:rgba(180,180,180,0.18); }

  /* 詳細モーダル */
  #detail-modal { display:none; position:fixed; inset:0; z-index:60; background:rgba(6,10,18,0.92); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:40px 24px; }
  #detail-modal.open { display:flex; }
  .modal-inner { max-width:580px; width:100%; border-left:1px solid rgba(200,220,255,0.14); padding:34px 38px; position:relative; max-height:78vh; overflow-y:auto; }
  .modal-date { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; color:rgba(200,169,58,0.40); letter-spacing:0.20em; margin-bottom:12px; }
  .modal-title { font-family:'IM Fell English',serif; font-size:19px; color:rgba(210,225,255,0.70); letter-spacing:0.06em; margin-bottom:20px; }
  .modal-body { font-size:14px; line-height:2.2; color:rgba(190,210,240,0.58); letter-spacing:0.04em; white-space:pre-wrap; }
  .modal-close { position:absolute; top:14px; right:14px; background:transparent; border:none; color:rgba(200,220,255,0.22); font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.20em; cursor:pointer; transition:color 0.3s; }
  .modal-close:hover { color:rgba(200,220,255,0.52); }
  .modal-delete { margin-top:26px; background:transparent; border:none; color:rgba(220,120,120,0.18); font-family:'Cormorant Garamond',serif; font-size:10px; letter-spacing:0.20em; cursor:pointer; transition:color 0.3s; display:none; }
  .modal-delete.show { display:inline; }
  .modal-delete:hover { color:rgba(220,120,120,0.48); }

  /* 投稿モーダル */
  #post-modal { display:none; position:fixed; inset:0; z-index:60; background:rgba(6,10,18,0.92); backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:40px 24px; }
  #post-modal.open { display:flex; }
  .post-inner { max-width:540px; width:100%; border-left:1px solid rgba(200,169,58,0.16); padding:34px 38px; position:relative; display:flex; flex-direction:column; gap:13px; }
  .post-label { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; color:rgba(200,169,58,0.38); letter-spacing:0.20em; }
  .form-input,.form-textarea,.form-select { background:rgba(4,8,18,0.55); border:none; border-bottom:1px solid rgba(200,220,255,0.15); color:rgba(210,225,255,0.75); font-family:'Shippori Mincho',serif; font-size:14px; padding:8px 4px; outline:none; resize:none; line-height:1.9; letter-spacing:0.04em; transition:border-color 0.3s; width:100%; }
  .form-textarea { min-height:120px; }
  .form-select { cursor:pointer; -webkit-appearance:none; appearance:none; color:rgba(200,215,255,0.58); }
  .form-select option { background:#0e1520; }
  .form-input:focus,.form-textarea:focus,.form-select:focus { border-color:rgba(200,220,255,0.30); }
  .form-input::placeholder,.form-textarea::placeholder { color:rgba(160,185,220,0.18); font-style:italic; }
  .form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .btn-post { background:transparent; border:1px solid rgba(200,169,58,0.26); color:rgba(200,169,58,0.62); font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.25em; text-transform:uppercase; padding:7px 20px; cursor:pointer; transition:all 0.3s; }
  .btn-post:hover { border-color:rgba(200,169,58,0.48); color:rgba(200,169,58,0.85); }
  .btn-cancel { background:transparent; border:1px solid rgba(200,220,255,0.09); color:rgba(160,185,220,0.30); font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.25em; text-transform:uppercase; padding:7px 20px; cursor:pointer; transition:all 0.3s; }
  .btn-cancel:hover { border-color:rgba(200,220,255,0.20); color:rgba(160,185,220,0.58); }
  .post-close { position:absolute; top:14px; right:14px; background:transparent; border:none; color:rgba(200,220,255,0.20); font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.20em; cursor:pointer; transition:color 0.3s; }
  .post-close:hover { color:rgba(200,220,255,0.48); }

  /* 新月ボタン */
  #new-moon-btn { display:none; position:fixed; bottom:30px; right:32px; z-index:30; width:34px; height:34px; border-radius:50%; cursor:pointer; background:radial-gradient(circle at 30% 35%,rgba(30,34,44,0.95),rgba(10,12,18,0.98)); border:1px solid rgba(200,220,255,0.11); box-shadow:0 2px 12px rgba(0,0,0,0.50),0 0 22px rgba(200,220,255,0.04); transition:box-shadow 0.3s,transform 0.3s; -webkit-mask:radial-gradient(circle at 68% 38%,transparent 32%,black 34%); mask:radial-gradient(circle at 68% 38%,transparent 32%,black 34%); }
  #new-moon-btn:hover { transform:scale(1.08); box-shadow:0 3px 18px rgba(0,0,0,0.60),0 0 32px rgba(200,220,255,0.09); }
  #new-moon-btn.show { display:block; }

  /* TOPに戻る */
  #back-top { display:flex; justify-content:center; padding:16px 0 56px; }
  #back-top-btn { width:13px; height:13px; border-radius:50%; background:rgba(200,220,255,0.25); border:none; cursor:pointer; transition:background 0.3s,transform 0.3s; display:block; }
  #back-top-btn:hover { background:rgba(200,220,255,0.48); transform:scale(1.2); }

  .side-bar { position:fixed; right:9px; top:50%; transform:translateY(-50%); width:1px; height:33vh; background:linear-gradient(to bottom,transparent,rgba(200,220,255,0.14) 30%,rgba(200,220,255,0.14) 70%,transparent); z-index:5; pointer-events:none; }

  .empty-note,.loading-note { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:12px; color:rgba(160,185,220,0.20); letter-spacing:0.15em; text-align:center; padding:60px 0; grid-column:1/-1; }

  footer { padding:18px 36px; border-top:1px solid rgba(200,220,255,0.05); display:flex; align-items:center; justify-content:center; gap:12px; position:relative; z-index:10; }
  .footer-line { flex:1; max-width:80px; height:1px; }
  .footer-line.blue { background:linear-gradient(to right,transparent,rgba(200,220,255,0.13)); }
  .footer-line.gold { background:linear-gradient(to left,transparent,rgba(200,169,58,0.13)); }
  .footer-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:10px; color:rgba(160,185,220,0.18); letter-spacing:0.20em; }

  @keyframes fadein { to { opacity:1; } }
  @media(max-width:580px){ .card-grid{grid-template-columns:1fr;} header{padding:16px 18px;} .log-wrap{padding:24px 16px 100px;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div id="main-content">
  <header>
    <a href="index.html" class="site-title">Remember the promise.</a>
    <nav>
      <a href="diary.html" class="active">Log</a>
      <a href="story.html" class="story-link" title="Story">🔒</a>
    </nav>
  </header>

  <div class="side-bar"></div>

  <div class="log-wrap">
    <div class="category-bar">
      <button class="cat-btn" data-cat="to">to</button>
      <button class="cat-btn" data-cat="me">me</button>
      <button class="cat-btn active" data-cat="all">all</button>
      <div class="cat-line"></div>
    </div>
    <div class="card-grid" id="card-grid">
      <div class="loading-note">— loading —</div>
    </div>
    <div id="back-top"><button id="back-top-btn" title="Top へ戻る"></button></div>
  </div>

  <footer>
    <div class="footer-line blue"></div>
    <span class="footer-text">Remember the promise.</span>
    <div class="footer-line gold"></div>
  </footer>
</div>

<div id="detail-modal">
  <div class="modal-inner">
    <button class="modal-close" id="modal-close">close</button>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <button class="modal-delete" id="modal-delete">delete</button>
  </div>
</div>

<div id="post-modal">
  <div class="post-inner">
    <button class="post-close" id="post-close">close</button>
    <div class="post-label">new entry</div>
    <input class="form-input" type="text" id="entry-title-input" placeholder="title" />
    <select class="form-select" id="entry-cat-input">
      <option value="to">to</option>
      <option value="me">me</option>
      <option value="all">all</option>
    </select>
    <textarea class="form-textarea" id="entry-body-input" placeholder="今日のこと、書いてください。"></textarea>
    <div class="form-actions">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-post" id="btn-post">Post</button>
    </div>
  </div>
</div>

<div id="new-moon-btn" title="New entry"></div>

<script>
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);
const SNOW=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+0.3,speed:Math.random()*0.00008+0.00003,alpha:Math.random()*0.24+0.05,wobble:Math.random()*Math.PI*2,ws:Math.random()*0.0007+0.0002}));
function draw(t){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a2130');bg.addColorStop(0.5,'#111822');bg.addColorStop(1,'#070b12');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const p of SNOW){p.y-=p.speed;p.wobble+=p.ws;if(p.y<-0.02){p.y=1.02;p.x=Math.random();}
    const px=(p.x+Math.sin(p.wobble)*0.013)*W,py=p.y*H;
    ctx.beginPath();ctx.arc(px,py,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,220,255,${p.alpha*(0.25+p.y*0.75)})`;ctx.fill();}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>

<script type="module">
import { initializeApp } from "www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore,collection,addDoc,getDocs,deleteDoc,doc,orderBy,query } from "www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDeO0QZ1wmxGmEcyu9W3SgSos1Y4T-4TYA",authDomain:"azul-1a3c9.firebaseapp.com",projectId:"azul-1a3c9",storageBucket:"azul-1a3c9.firebasestorage.app",messagingSenderId:"107176111624",appId:"1:107176111624:web:78bc25fbe09bcd3b47ebbd"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);

// ---- 書き込みパスワード（indexのパスワードと別でOK）----
const WRITE_PW='azul2024'; // ← 変えてください
let isOwner=false;

// sessionStorageでオーナー状態を保持
if(sessionStorage.getItem('rtp-owner')==='1'){isOwner=true;}

function escHtml(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');}

let allEntries=[],currentCat='all',currentEntryId=null;

async function loadEntries(){
  const grid=document.getElementById('card-grid');
  grid.innerHTML='<div class="loading-note">— loading —</div>';
  try{
    const q=query(collection(db,'entries'),orderBy('createdAt','desc'));
    const snap=await getDocs(q);
    allEntries=[];
    snap.forEach(d=>allEntries.push({id:d.id,...d.data()}));
    if(isOwner)document.getElementById('new-moon-btn').classList.add('show');
    renderCards();
  }catch(e){grid.innerHTML='<div class="empty-note">— 読み込みに失敗しました —</div>';}
}

function renderCards(){
  const grid=document.getElementById('card-grid');
  const filtered=currentCat==='all'?allEntries:allEntries.filter(e=>e.category===currentCat);
  grid.innerHTML='';
  if(filtered.length===0){grid.innerHTML='<div class="empty-note">— まだ何も書かれていない —</div>';return;}
  filtered.forEach((entry,i)=>{
    const card=document.createElement('div');
    card.className='log-card';card.style.animationDelay=`${i*0.06}s`;
    const preview=(entry.body||'').slice(0,40);
    card.innerHTML=`<div class="card-date">${escHtml(entry.date||'')}</div><div class="card-title">${escHtml(entry.title||'— 無題 —')}</div><div class="card-body">${escHtml(preview)}</div><div class="card-cat-dot dot-${entry.category||'all'}"></div>`;
    card.addEventListener('click',()=>openDetail(entry));
    grid.appendChild(card);
  });
}

function openDetail(entry){
  currentEntryId=entry.id;
  document.getElementById('modal-date').textContent=entry.date||'';
  document.getElementById('modal-title').textContent=entry.title||'— 無題 —';
  document.getElementById('modal-body').textContent=entry.body||'';
  const del=document.getElementById('modal-delete');
  isOwner?del.classList.add('show'):del.classList.remove('show');
  document.getElementById('detail-modal').classList.add('open');
}

async function deleteEntry(){
  if(!isOwner||!currentEntryId)return;
  try{
    await deleteDoc(doc(db,'entries',currentEntryId));
    document.getElementById('detail-modal').classList.remove('open');
    allEntries=allEntries.filter(e=>e.id!==currentEntryId);
    currentEntryId=null;renderCards();
  }catch(e){alert('削除に失敗しました。');}
}

async function postEntry(){
  if(!isOwner)return;
  const title=document.getElementById('entry-title-input').value.trim();
  const body=document.getElementById('entry-body-input').value.trim();
  const cat=document.getElementById('entry-cat-input').value;
  if(!body)return;
  const now=new Date();
  const date=now.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-');
  try{
    const ref=await addDoc(collection(db,'entries'),{title:title||'— 無題 —',body,date,category:cat,createdAt:now.getTime()});
    allEntries.unshift({id:ref.id,title:title||'— 無題 —',body,date,category:cat,createdAt:now.getTime()});
    document.getElementById('entry-title-input').value='';
    document.getElementById('entry-body-input').value='';
    document.getElementById('post-modal').classList.remove('open');
    renderCards();
  }catch(e){alert('投稿に失敗しました。');}
}

// オーナー認証（新月ボタン長押しでパスワード入力）
let pressTimer=null;
document.getElementById('new-moon-btn').addEventListener('mousedown',()=>{
  if(isOwner)return;
  pressTimer=setTimeout(()=>{
    const pw=prompt('write password');
    if(pw===WRITE_PW){isOwner=true;sessionStorage.setItem('rtp-owner','1');document.getElementById('new-moon-btn').classList.add('show');}
  },800);
});
document.getElementById('new-moon-btn').addEventListener('mouseup',()=>clearTimeout(pressTimer));

document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentCat=btn.dataset.cat;renderCards();
  });
});

document.getElementById('modal-close').addEventListener('click',()=>document.getElementById('detail-modal').classList.remove('open'));
document.getElementById('modal-delete').addEventListener('click',deleteEntry);
document.getElementById('new-moon-btn').addEventListener('click',()=>{if(isOwner)document.getElementById('post-modal').classList.add('open');});
document.getElementById('post-close').addEventListener('click',()=>document.getElementById('post-modal').classList.remove('open'));
document.getElementById('btn-cancel').addEventListener('click',()=>document.getElementById('post-modal').classList.remove('open'));
document.getElementById('btn-post').addEventListener('click',postEntry);
document.getElementById('back-top-btn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.getElementById('detail-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.getElementById('post-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});

loadEntries();
</script>
</body>
</html>
